{% extends 'base.html' %}
{% block title %}Añadir cliente · DCRM{% endblock %}

{% block content %}
<div class="d-flex justify-content-center">
  <div style="width:100%;max-width:560px">
    <div class="breadcrumb-lite"><a href="{% url 'clientes' %}">← Clientes</a><span class="sep">/</span>Añadir cliente</div>
    <h1 class="page-title mb-1" style="font-size:1.45rem">Añadir cliente</h1>
    <p class="page-sub mb-3">Solo el nombre es obligatorio; el resto lo puedes completar después.</p>
    <div class="card"><div class="card-body p-4">
      <form method="POST" action="{% url 'add_record' %}" enctype="multipart/form-data">
        {% csrf_token %}
        {% include 'record_form_fields.html' %}
        <div class="d-flex gap-2 justify-content-end">
          <a href="{% url 'clientes' %}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar cliente</button>
        </div>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
