{% extends 'base.html' %}
{% block title %}Ingresar · DCRM{% endblock %}

{% block main %}
<main class="auth-main">
  <div class="auth-wrap">
    {% include 'flashes.html' %}
    <div class="auth-logo">D</div>
    <h1 class="auth-title">Ingresa a tu cuenta</h1>
    <p class="auth-sub">Gestiona tu cartera de clientes</p>
    <div class="card"><div class="card-body p-4">
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="usuario">Usuario</label>
          <input class="form-control" id="usuario" name="username" placeholder="Tu nombre de usuario" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="clave">Contraseña</label>
          <input type="password" class="form-control" id="clave" name="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div></div>
    <p class="auth-foot">¿No tienes cuenta? <a class="fw-semibold text-decoration-none" href="{% url 'register' %}">Regístrate</a></p>
  </div>
</main>
{% endblock %}
