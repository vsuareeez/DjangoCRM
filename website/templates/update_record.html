{% extends 'base.html' %}
{% block content %}

<div class="col-md-6 offset-md-3">
    <h1 class="fw-bold"><i class="bi bi-pencil-square me-2" style="color: var(--accent-blue);"></i>Actualizar Cliente</h1>
    <br/>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <br/>
        <button type="submit" class="btn btn-primary" style="background-color: var(--accent-blue); border: none;">
            <i class="bi bi-check-lg me-2"></i>Actualizar Cliente
        </button>
        <a href="{% url 'clientes' %}" class="btn btn-light">Volver</a>
    </form>
</div>

{% endblock %}
